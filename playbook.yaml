---

# hosts
- hosts: qalinux
  user: avi
  become: yes
  connection: ssh
  gather_facts: yes
    
# target
  tasks:
  - name: install docker
    action: dnf name=docker state=present

  - name: clonning_git_repo
    action: ansible.builtin.git repo=https://github.com/avshelke1996/docker-compose_ansible_playbook.git dest=giiit
  
  - name: execute_docker_compose
    action: ansible.builtin.command cmd=docker-compose up -d chdir=/home/avi/giiit
    
