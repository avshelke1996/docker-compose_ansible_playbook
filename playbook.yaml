---

# hosts
- hosts: qalinux
  user: avi
  become: yes
  connection: ssh
  gather_facts: yes
    
# target
  tasks:
  - name: install docker
    action: dnf name=docker state=present

  - name: docker compose url
    action: get_url url=https://github.com/docker/compose/releases/download/v5.6.0/docker-compose-linux-x86_64 dest=/usr/local/bin/docker-compose mode=0755

  - name: file
    action: file src=/usr/local/bin/docker-compose dest=/usr/bin/docker-compose state=link

  - name: clonning_git_repo
    action: ansible.builtin.git repo=https://github.com/avshelke1996/docker-compose_ansible_playbook.git dest=giiit
  
  - name: execute_docker_compose
    action: ansible.builtin.command cmd=docker-compose up -d chdir=/home/avi/giiit
    
